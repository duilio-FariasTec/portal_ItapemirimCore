services:
  ani-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itapemirim-ani-api
    ports:
      - "5146:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - DatabaseProvider=Sqlite
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/ani.db
      - Jwt__SecretKey=Itapemirim_PortalCore_SuperSecret_JwtKey_2026_Minimum32Bytes!
      - Jwt__Issuer=PortalItapemirimCore
      - Jwt__Audience=PortalItapemirimApp
    volumes:
      - ani-sqlite-data:/app/data
    restart: unless-stopped

